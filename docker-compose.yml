# AgentOps:  docker compose up --build
#   UI  http://localhost:3200      API docs  http://localhost:8200/docs
name: agentops

x-db-passwords: &db-passwords
  AGENTOPS_OWNER_PASSWORD: ${AGENTOPS_OWNER_PASSWORD:-agentops_owner}
  AGENTOPS_APP_PASSWORD: ${AGENTOPS_APP_PASSWORD:-agentops_app}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://agentops_app:${AGENTOPS_APP_PASSWORD:-agentops_app}@pgbouncer:6432/agentops
  DATABASE_URL_OWNER: postgresql+psycopg://agentops_owner:${AGENTOPS_OWNER_PASSWORD:-agentops_owner}@db:5432/agentops
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-me}
  TRUSTED_PROXY: ${TRUSTED_PROXY:-true}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3200}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SEED_DEMO: ${SEED_DEMO:-true}
  DEMO_SCALE: ${DEMO_SCALE:-0.25}
  LLM_PROVIDER: ${LLM_PROVIDER:-stub}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
  LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-3.0}
  LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-15.0}
  ALLOW_PRIVATE_LLM_URLS: ${ALLOW_PRIVATE_LLM_URLS:-true}
  RUN_MAX_STEPS: ${RUN_MAX_STEPS:-25}
  RUN_MAX_TOKENS: ${RUN_MAX_TOKENS:-200000}
  RUN_MAX_SECONDS: ${RUN_MAX_SECONDS:-300}
  RUN_MAX_COST_USD: ${RUN_MAX_COST_USD:-1.00}
  ORG_DAILY_COST_USD: ${ORG_DAILY_COST_USD:-20.00}
  GLOBAL_DAILY_COST_USD: ${GLOBAL_DAILY_COST_USD:-200.00}
  ORG_MAX_CONCURRENT_RUNS: ${ORG_MAX_CONCURRENT_RUNS:-5}
  ORG_MAX_QUEUED_RUNS: ${ORG_MAX_QUEUED_RUNS:-15}
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-true}
  JUDGE_MIN_LABELS: ${JUDGE_MIN_LABELS:-20}
  JUDGE_MIN_KAPPA: ${JUDGE_MIN_KAPPA:-0.6}
  GATE_MIN_GRADED: ${GATE_MIN_GRADED:-20}
  EXPERIMENT_MAX_ITEMS: ${EXPERIMENT_MAX_ITEMS:-2000}
  EXPERIMENT_MAX_COST_USD: ${EXPERIMENT_MAX_COST_USD:-5.00}
  INGEST_REQUESTS_PER_MINUTE: ${INGEST_REQUESTS_PER_MINUTE:-600}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      <<: *db-passwords
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d agentops"]
      interval: 3s
      retries: 30

  pgbouncer:
    build: ./infra/pgbouncer
    environment:
      <<: *db-passwords
    ports: ["127.0.0.1:56442:6432"]
    depends_on:
      db: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  migrate:   # applies migrations and, when SEED_DEMO=true, loads the demo data; then exits
    build: ./backend
    command: ["python", "-m", "app.bootstrap"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build: ./backend
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach a model gateway or Ollama on the host
    ports: ["127.0.0.1:8200:8000"]   # API docs for the person running it; everyone else goes through web
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  worker:   # scale out with:  docker compose up --scale worker=4
    build: ./backend
    command: ["python", "-m", "app.worker.run", "--concurrency", "${WORKER_CONCURRENCY:-4}"]
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  ingest:   # writes received trace batches to storage; scale with --scale ingest=4
    build: ./backend
    command: ["python", "-m", "app.worker.ingest", "--concurrency", "${INGEST_CONCURRENCY:-4}"]
    environment: *backend-env
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  web:   # the UI and, for other projects' containers, OTLP ingestion (/v1/traces) on the same port
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:3200:80"                # this machine's browser; plain HTTP, TLS belongs to a proxy
      - "${WEB_INGEST_BIND:-172.17.0.1}:3200:80"        # Docker bridge gateway: host.docker.internal:3200, not the LAN
    depends_on: [api]

volumes:
  pgdata:
